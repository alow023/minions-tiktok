name: score

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decompress catalog
        run: |
          if [ ! -f data/catalog.jsonl ]; then
            gzip -dk data/catalog.jsonl.gz
          fi
          wc -l data/catalog.jsonl data/public_set.jsonl

      - name: Guard against evaluator edits
        run: |
          # Competition rule: local scores are only valid with an unmodified
          # evaluator and unmodified public labels.
          git fetch origin main --depth=1
          if ! git diff --quiet origin/main -- evaluator/ data/public_set.jsonl; then
            echo "::error::evaluator/ or data/public_set.jsonl differs from main"
            git diff --stat origin/main -- evaluator/ data/public_set.jsonl
            exit 1
          fi

      - name: Run evaluator
        run: python3 -m evaluator.local_evaluator --output results.json

      - name: Publish score to run summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib

          d = json.loads(pathlib.Path("results.json").read_text())
          print("## Technical score: %.4f\n" % d["recommended_technical_score"])
          print("| metric | value |")
          print("| --- | --- |")
          for k in ("sample_count", "hit_rate_at_10", "mrr", "mttc", "efficiency"):
              print(f"| {k} | {d[k]} |")

          print("\n### By scenario\n")
          print("| scenario | n | hit@10 | mrr | mttc |")
          print("| --- | --- | --- | --- | --- |")
          for name, m in sorted(d["scenario_metrics"].items()):
              print("| %s | %d | %.3f | %.4f | %.2f |"
                    % (name, m["sample_count"], m["hit_rate_at_10"], m["mrr"], m["mttc"]))

          u = d["reported_token_usage"]
          print(f"\nTokens: {u['prompt_tokens']} prompt / {u['completion_tokens']} completion")
          PY

      - name: Fail if worse than the recorded baseline
        run: |
          python3 - <<'PY'
          import json, pathlib

          score = json.loads(pathlib.Path("results.json").read_text())["recommended_technical_score"]
          base = json.loads(pathlib.Path("docs/baseline_results.json").read_text())
          floor = base.get("recommended_technical_score", 0.0)
          print(f"score={score:.6f} baseline={floor:.6f}")
          if score < floor:
              raise SystemExit(f"regression: {score:.6f} < baseline {floor:.6f}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ github.sha }}
          path: results.json
